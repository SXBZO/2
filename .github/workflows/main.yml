    steps:
      - name: تثبيت ffmpeg و yt-dlp
        run: |
          set -e
          echo "═══ التثبيت ═══"
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          
          echo "✅ ffmpeg: $(ffmpeg -version | head -n 1)"
          echo "✅ yt-dlp: $(yt-dlp --version)"

      - name: تشغيل البث (مع الكوكيز المدمجة)
        run: |
          set -e
          echo "🚀 بدء تشغيل الجسر: $YOUTUBE_URL -> Restream"

          while true; do
            echo "─── [$(date -u +%H:%M:%S)] محاولة الاتصال بالمصدر... ───"
            
            # استخراج الرابط باستخدام الكوكيز المدمجة في المتغيرات
            STREAM_URL=$(yt-dlp -g -f best \
              --add-header "Cookie: $YOUTUBE_COOKIES" \
              --no-warnings \
              --no-check-certificate \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              --extractor-args "youtube:player_client=web,android,ios" \
              "$YOUTUBE_URL" 2>/dev/null | head -n 1 || true)

            if [ -z "$STREAM_URL" ]; then
              echo "⚠️ لم يتم العثور على رابط بث. قد يكون البث متوقفاً حالياً."
              echo "⏳ إعادة المحاولة بعد 10 ثوانٍ..."
              sleep 10
              continue
            fi

            echo "✅ تم استخراج الرابط بنجاح، جاري التمرير إلى Restream..."

            ffmpeg -hide_banner -loglevel warning -nostdin \
              -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
              -rw_timeout 10000000 \
              -i "$STREAM_URL" \
              -c:v copy -c:a aac -b:a 160k -ar 44100 -ac 2 \
              -max_muxing_queue_size 4096 \
              -flvflags no_duration_filesize \
              -f flv "rtmp://live.restream.io/live/$RESTREAM_KEY" || true

            echo "⚠️ انقطع البث. إعادة المحاولة خلال 5 ثوانٍ..."
            sleep 5
          done

      - name: جدولة الرن التالي (احتياطي)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          setsid nohup bash -c "
            sleep 19800
            gh workflow run main.yml --ref '${{ github.ref_name }}'
          " >/tmp/sched.log 2>&1 < /dev/null &
          echo "✅ تم جدولة الرن التالي."
