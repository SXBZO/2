name: Drive Video to Restream 24-7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  actions: write
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    env:
      RESTREAM_KEY: "re_12552561_event81737fba9ada4713ab13ad7e04a36880"

    steps:
      - name: جلب الملفات
        uses: actions/checkout@v4

      - name: تثبيت ffmpeg و gdown
        run: |
          set -e
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg curl
          pip3 install --user --break-system-packages --quiet gdown
          echo "✅ ffmpeg: $(ffmpeg -version | head -n 1)"

      - name: تشغيل البث
        run: |
          chmod +x stream.sh
          ./stream.sh
