name: YouTube to Restream 24-7 Relay (No-Cookie)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # احتياطي كل 6 ساعات

permissions:
  actions: write
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    # ═══════════════════════════════════════════════════
    # الإعدادات
    # ═══════════════════════════════════════════════════
    env:
      RESTREAM_KEY: "re_12552561_event81737fba9ada4713ab13ad7e04a36880"
      YOUTUBE_URL: "https://www.youtube.com/live/eC4LfEVxvKg"
    # ═══════════════════════════════════════════════════

    steps:
      - name: تثبيت ffmpeg و yt-dlp و streamlink
        run: |
          set -e
          echo "═══ التثبيت ═══"
          # إزالة مستودعات Microsoft لتجنب تعارض الحزم
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          
          # تثبيت yt-dlp (أحدث إصدار)
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          
          # تثبيت streamlink كأداة احتياطية
          pip3 install --user --break-system-packages --quiet --upgrade streamlink
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
          echo "✅ ffmpeg: $(ffmpeg -version | head -n 1)"
          echo "✅ yt-dlp: $(yt-dlp --version)"

      - name: تشغيل البث (مع إعادة الاتصال التلقائي)
        run: |
          set -e
          echo "🚀 بدء تشغيل الجسر: $YOUTUBE_URL -> Restream"

          # حلقة لا نهائية لضمان استمرار البث
          while true; do
            echo "─── [$(date -u +%H:%M:%S)] محاولة الاتصال بالمصدر... ───"
            
            STREAM_URL=""

            # المحاولة الأولى: yt-dlp مع التظاهر بأنه جهاز iOS أو Android أو تلفاز
            echo "🔄 محاولة 1: yt-dlp (Mobile/TV Client)..."
            STREAM_URL=$(yt-dlp -g -f best \
              --extractor-args "youtube:player_client=ios,android,web_embedded" \
              --no-warnings \
              "$YOUTUBE_URL" 2>/dev/null | head -n 1 || true)

            # المحاولة الثانية: streamlink (إذا فشلت الأولى)
            if [ -z "$STREAM_URL" ]; then
              echo "🔄 محاولة 2: streamlink..."
              STREAM_URL=$(streamlink --stream-url "$YOUTUBE_URL" best 2>/dev/null || true)
            fi

            # التحقق من النتيجة
            if [ -z "$STREAM_URL" ]; then
              echo "⚠️ لم يتم العثور على رابط بث. البث قد يكون متوقفاً حالياً، أو يوتيوب يحظر السيرفر."
              echo "⏳ إعادة المحاولة بعد 10 ثوانٍ..."
              sleep 10
              continue
            fi

            echo "✅ تم استخراج الرابط بنجاح، جاري التمرير إلى Restream..."

            # تمرير البث باستخدام ffmpeg
            ffmpeg -hide_banner -loglevel warning -nostdin \
              -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
              -rw_timeout 10000000 \
              -i "$STREAM_URL" \
              -c:v copy -c:a aac -b:a 160k -ar 44100 -ac 2 \
              -max_muxing_queue_size 4096 \
              -flvflags no_duration_filesize \
              -f flv "rtmp://live.restream.io/live/$RESTREAM_KEY" || true

            echo "⚠️ انقطع البث. إعادة المحاولة خلال 5 ثوانٍ..."
            sleep 5
          done

      - name: جدولة الرن التالي (احتياطي)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          setsid nohup bash -c "
            sleep 19800
            gh workflow run main.yml --ref '${{ github.ref_name }}'
          " >/tmp/sched.log 2>&1 < /dev/null &
          echo "✅ تم جدولة الرن التالي."
